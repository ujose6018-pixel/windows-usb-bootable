<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows USB Booteable - Chrome OS Flex</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tabler-icons@latest/tabler-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 14px;
        }

        .step {
            display: none;
            animation: slideIn 0.3s ease-in-out;
        }

        .step.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
        }

        .progress-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .progress-dot.completed {
            background: #10b981;
            color: white;
        }

        .progress-dot.active {
            background: #667eea;
            color: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        .progress-dot.pending {
            background: #e5e7eb;
            color: #999;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 2rem;
            justify-content: space-between;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .code-block {
            background: #1f2937;
            color: #10b981;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 1rem 0;
            line-height: 1.6;
            position: relative;
        }

        .code-block .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .code-block .copy-btn:hover {
            background: #5568d3;
        }

        .info-box {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 13px;
            color: #1e40af;
        }

        .warning-box {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 16px;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 13px;
            color: #92400e;
        }

        .success-box {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            padding: 16px;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 13px;
            color: #065f46;
        }

        .checklist {
            list-style: none;
            margin: 1rem 0;
        }

        .checklist li {
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .checklist li:before {
            content: "✓";
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            font-weight: bold;
            font-size: 12px;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-list {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 13px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-icon {
            width: 24px;
            height: 24px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .breadcrumb {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
            font-size: 12px;
            color: #999;
        }

        .breadcrumb span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .breadcrumb .active {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [currentStep, setCurrentStep] = useState(0);
            const [formData, setFormData] = useState({
                windowsVersion: '11',
                usbDevice: 'auto'
            });
            const [downloaded, setDownloaded] = useState({
                iso: false,
                driver: false,
                script: false
            });

            const steps = [
                {
                    title: "Bienvenido",
                    description: "Vamos a crear un USB booteable con Windows"
                },
                {
                    title: "Selecciona opciones",
                    description: "Elige tu versión de Windows y detecta el USB"
                },
                {
                    title: "Descarga archivos",
                    description: "ISO de Windows y driver NVMe"
                },
                {
                    title: "Copia el script",
                    description: "Ejecuta un comando en terminal"
                },
                {
                    title: "Reinicia e instala",
                    description: "Sigue los pasos en BIOS"
                }
            ];

            const generateScript = () => {
                const devicePath = formData.usbDevice === 'auto' ? '/dev/sdX' : `/dev/sd${formData.usbDevice}`;
                return `#!/bin/bash
# Windows ${formData.windowsVersion} USB Booteable
# Chrome OS Flex

set -e
GREEN='\\033[0;32m'
YELLOW='\\033[1;33m'
RED='\\033[0;31m'
NC='\\033[0m'

echo -e "\\${YELLOW}⚠ ADVERTENCIA: Esto borrará TODO en ${devicePath}\\${NC}"
lsblk | grep -E "^sd|^nvme"
echo ""
read -p "¿Es correcto ${devicePath}? (escribir 'si' para continuar): " confirm
[[ "$confirm" != "si" ]] && echo "Cancelado" && exit 1

WORKDIR="/home/chronos/windows_usb"
mkdir -p $WORKDIR
cd $WORKDIR

echo -e "\\${GREEN}[1/3] Descargando ISO de Windows ${formData.windowsVersion}...\\${NC}"
if [ ! -f "windows.iso" ]; then
    wget -q --show-progress -O windows.iso https://go.microsoft.com/fwlink/p/?linkid=2156292
fi

echo -e "\\${GREEN}[2/3] Instalando Etcher...\\${NC}"
if ! command -v balena-etcher &> /dev/null; then
    wget -q --show-progress https://github.com/balena-io/etcher/releases/download/v1.18.13/balena-etcher-1.18.13-linux-x64.zip
    unzip -q balena-etcher-*.zip
    chmod +x balena-etcher-*/balena-etcher-1.18.13/balena-etcher
fi

echo -e "\\${GREEN}[3/3] Abriendo Etcher...\\${NC}"
./balena-etcher-*/balena-etcher-1.18.13/balena-etcher &
echo ""
echo "=== EN LA VENTANA DE ETCHER ==="
echo "1. Click en 'Flash from file' → selecciona windows.iso"
echo "2. Click en 'Select target' → elige ${devicePath}"
echo "3. Click en 'Flash'"
echo "4. Espera a que termine (10-15 min)"
echo ""
read -p "¿Etcher terminó? (escribe 'si'): " done
[[ "$done" != "si" ]] && exit 1

echo -e "\\${GREEN}✓ USB booteable listo${NC}"
echo ""
echo "PRÓXIMOS PASOS:"
echo "1. Desconecta el USB"
echo "2. Reinicia tu HP"
echo "3. Durante arranque, presiona F2"
echo "4. Ve a System Configuration → desactiva Intel VMD"
echo "5. Ve a Boot Options → cambia a USB"
echo "6. Guarda (F10) y reinicia"
`;
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    alert('¡Script copiado al portapapeles!');
                });
            };

            const handleNextStep = () => {
                if (currentStep < steps.length - 1) {
                    setCurrentStep(currentStep + 1);
                }
            };

            const handlePrevStep = () => {
                if (currentStep > 0) {
                    setCurrentStep(currentStep - 1);
                }
            };

            return (
                <div className="container">
                    <div className="card">
                        <h1>
                            <i className="ti ti-usb" style={{fontSize: '32px'}}></i>
                            Windows USB Booteable
                        </h1>
                        <p className="subtitle">Para Chrome OS Flex sin terminal complicada</p>

                        <div className="progress-bar">
                            {steps.map((step, idx) => (
                                <div
                                    key={idx}
                                    className={`progress-dot ${idx === currentStep ? 'active' : idx < currentStep ? 'completed' : 'pending'}`}
                                    onClick={() => setCurrentStep(idx)}
                                    title={step.title}
                                >
                                    {idx < currentStep ? '✓' : idx + 1}
                                </div>
                            ))}
                        </div>

                        {/* PASO 0: Bienvenida */}
                        <div className={`step ${currentStep === 0 ? 'active' : ''}`}>
                            <h2 style={{marginBottom: '1rem', color: '#333'}}>Bienvenido 👋</h2>
                            <p style={{color: '#666', lineHeight: '1.6', marginBottom: '1.5rem'}}>
                                Esta herramienta te ayudará a crear un USB booteable con Windows de forma sencilla, 
                                sin necesidad de usar terminal complicada. Solo necesitas:
                            </p>
                            <ul className="checklist">
                                <li>Un USB de 8GB o más</li>
                                <li>Tu Chrome OS Flex</li>
                                <li>Conexión a internet</li>
                                <li>20-30 minutos</li>
                            </ul>
                            <div className="warning-box">
                                <strong>⚠ Importante:</strong> El USB se formateará completamente. 
                                Asegúrate de que no tenga datos importantes.
                            </div>
                            <div className="button-group">
                                <div></div>
                                <button className="btn-primary" onClick={handleNextStep}>
                                    Siguiente
                                    <i className="ti ti-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        {/* PASO 1: Configuración */}
                        <div className={`step ${currentStep === 1 ? 'active' : ''}`}>
                            <h2 style={{marginBottom: '1.5rem', color: '#333'}}>Selecciona tus opciones</h2>
                            
                            <div className="form-group">
                                <label>¿Qué versión de Windows quieres?</label>
                                <select 
                                    value={formData.windowsVersion}
                                    onChange={(e) => setFormData({...formData, windowsVersion: e.target.value})}
                                >
                                    <option value="11">Windows 11 (recomendado)</option>
                                    <option value="10">Windows 10</option>
                                </select>
                            </div>

                            <div className="form-group">
                                <label>¿Cómo conectaste el USB?</label>
                                <select 
                                    value={formData.usbDevice}
                                    onChange={(e) => setFormData({...formData, usbDevice: e.target.value})}
                                >
                                    <option value="auto">Detectar automáticamente (recomendado)</option>
                                    <option value="sdb">Manual: /dev/sdb</option>
                                    <option value="sdc">Manual: /dev/sdc</option>
                                    <option value="sdd">Manual: /dev/sdd</option>
                                </select>
                            </div>

                            <div className="info-box">
                                <strong>ℹ Si no sabes cuál es tu USB:</strong> En el siguiente paso te mostraremos 
                                un comando para detectarlo automáticamente.
                            </div>

                            <div className="button-group">
                                <button className="btn-secondary" onClick={handlePrevStep}>
                                    <i className="ti ti-arrow-left"></i>
                                    Atrás
                                </button>
                                <button className="btn-primary" onClick={handleNextStep}>
                                    Siguiente
                                    <i className="ti ti-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        {/* PASO 2: Descargas */}
                        <div className={`step ${currentStep === 2 ? 'active' : ''}`}>
                            <h2 style={{marginBottom: '1.5rem', color: '#333'}}>Archivos necesarios</h2>
                            
                            <p style={{color: '#666', marginBottom: '1rem'}}>
                                Necesitamos 2 cosas. Descargarlas es automático en el siguiente paso:
                            </p>

                            <div className="file-list">
                                <div className="file-item">
                                    <div className="file-icon">📦</div>
                                    <div>
                                        <strong>Windows {formData.windowsVersion} ISO</strong>
                                        <div style={{color: '#999', fontSize: '12px'}}>~5GB - Imagen de Windows</div>
                                    </div>
                                </div>
                                <div className="file-item">
                                    <div className="file-icon">🔧</div>
                                    <div>
                                        <strong>Driver RST NVMe</strong>
                                        <div style={{color: '#999', fontSize: '12px'}}>~100MB - Para que Windows vea tu disco</div>
                                    </div>
                                </div>
                            </div>

                            <div className="info-box">
                                <strong>ℹ Balena Etcher:</strong> Es una herramienta gratuita que copia la ISO 
                                al USB de forma segura. Se descargará automáticamente.
                            </div>

                            <div className="success-box">
                                <strong>✓ El proceso total toma ~20 minutos</strong><br/>
                                (Depende de tu velocidad de internet y USB)
                            </div>

                            <div className="button-group">
                                <button className="btn-secondary" onClick={handlePrevStep}>
                                    <i className="ti ti-arrow-left"></i>
                                    Atrás
                                </button>
                                <button className="btn-primary" onClick={handleNextStep}>
                                    Siguiente
                                    <i className="ti ti-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        {/* PASO 3: Script */}
                        <div className={`step ${currentStep === 3 ? 'active' : ''}`}>
                            <h2 style={{marginBottom: '1rem', color: '#333'}}>Copia este comando</h2>
                            <p style={{color: '#666', marginBottom: '1rem'}}>
                                Este es el único comando que necesitas ejecutar en terminal. 
                                Haz click para copiar:
                            </p>

                            <div className="code-block">
                                <button 
                                    className="copy-btn"
                                    onClick={() => copyToClipboard(generateScript())}
                                >
                                    📋 Copiar
                                </button>
                                <pre style={{margin: 0, maxHeight: '400px', overflow: 'auto'}}>
{generateScript()}
                                </pre>
                            </div>

                            <div className="info-box" style={{marginTop: '1.5rem'}}>
                                <strong>ℹ Cómo usar en Chrome OS Flex:</strong>
                                <ol style={{marginLeft: '1rem', marginTop: '8px'}}>
                                    <li>Abre una terminal: <code style={{background: '#e5e7eb', padding: '2px 4px'}}>Ctrl + Alt + T</code></li>
                                    <li>Escribe: <code style={{background: '#e5e7eb', padding: '2px 4px'}}>shell</code></li>
                                    <li>Pega el comando (Ctrl + Shift + V)</li>
                                    <li>Presiona Enter</li>
                                </ol>
                            </div>

                            <div className="button-group">
                                <button className="btn-secondary" onClick={handlePrevStep}>
                                    <i className="ti ti-arrow-left"></i>
                                    Atrás
                                </button>
                                <button className="btn-primary" onClick={handleNextStep}>
                                    Siguiente
                                    <i className="ti ti-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        {/* PASO 4: Instalación */}
                        <div className={`step ${currentStep === 4 ? 'active' : ''}`}>
                            <h2 style={{marginBottom: '1.5rem', color: '#333'}}>Reinicia e instala Windows</h2>
                            
                            <div className="success-box" style={{marginBottom: '1.5rem'}}>
                                <strong>✓ Tu USB está listo!</strong><br/>
                                Ahora vamos a instalar Windows en tu HP
                            </div>

                            <h3 style={{marginTop: '1.5rem', marginBottom: '1rem', color: '#333'}}>Pasos en tu HP 15s:</h3>
                            
                            <ol style={{marginLeft: '1.5rem', lineHeight: '2', color: '#666', marginBottom: '1.5rem'}}>
                                <li><strong>Desconecta el USB del Chrome OS Flex</strong></li>
                                <li><strong>Conecta el USB a tu HP</strong></li>
                                <li><strong>Reinicia tu HP:</strong> Apaga completamente y enciende</li>
                                <li><strong>Durante el arranque, presiona F2</strong> (rápido, antes de que aparezca Windows)</li>
                                <li><strong>Ve a "System Configuration"</strong> (o "Advanced")</li>
                                <li><strong>Busca "Intel VMD"</strong> y <strong>desactívalo</strong></li>
                                <li><strong>Ve a "Boot Options"</strong> y <strong>cambia a USB</strong></li>
                                <li><strong>Guarda con F10</strong> y reinicia</li>
                                <li><strong>Arrancará desde el USB</strong> - Sigue el instalador de Windows normalmente</li>
                                <li><strong>Si pide driver NVMe:</strong> Busca en el USB la carpeta "drivers"</li>
                            </ol>

                            <div className="warning-box">
                                <strong>⚠ Recuerda:</strong> Es IMPORTANTE desactivar Intel VMD en BIOS. 
                                Sin eso, Windows no verá tu disco duro.
                            </div>

                            <div className="info-box">
                                <strong>ℹ Dudas?</strong> Si algo no funciona, revisa que hayas hecho:
                                <ul style={{marginLeft: '1rem', marginTop: '8px'}}>
                                    <li>✓ Copiado el script correctamente</li>
                                    <li>✓ Verificado que el USB es el correcto (lsblk)</li>
                                    <li>✓ Desactivado Intel VMD en BIOS</li>
                                </ul>
                            </div>

                            <div className="button-group">
                                <button className="btn-secondary" onClick={handlePrevStep}>
                                    <i className="ti ti-arrow-left"></i>
                                    Atrás
                                </button>
                                <button className="btn-primary" onClick={() => window.location.href = '#'}>
                                    ✓ Listo, empezar de nuevo
                                </button>
                            </div>
                        </div>
                    </div>

                    <div style={{textAlign: 'center', color: 'white', marginTop: '2rem', fontSize: '12px'}}>
                        <p>Creado para hacer la vida más fácil en Chrome OS Flex</p>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
